name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: anchor
          POSTGRES_PASSWORD: anchor
          POSTGRES_DB: anchor_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U anchor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version comes from package.json#packageManager (pnpm@10.34.5, Node 20 compatible).
        # Pinning `version: 11` here conflicts with that field.

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @anchor/api exec prisma generate

      - name: Lint
        run: pnpm lint
        continue-on-error: true # lint warnings shouldn't block yet

      - name: Typecheck
        run: pnpm typecheck
        env:
          DATABASE_URL: postgresql://anchor:anchor@localhost:5432/anchor_test?schema=public

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://anchor:anchor@localhost:5432/anchor_test?schema=public
